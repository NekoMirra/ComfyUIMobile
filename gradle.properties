org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# AGP 9 built-in Kotlin: the org.jetbrains.kotlin.android plugin is not compatible with the
# new DSL, and Glasmio 0.1.1 AARs carry Kotlin 2.4 metadata that only a 2.4 compiler reads.
android.builtInKotlin=true
android.newDsl=true
# Glasmio 0.1.1 AARs declare minCompileSdk=37.
android.suppressUnsupportedCompileSdk=37
# Dependency downloads in this environment must go through the local proxy.
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=7897
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=7897
# Large artifacts (material-icons-extended is ~34 MB) need long TLS handshakes.
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=120000
systemProp.org.gradle.internal.repository.max.retries=8
systemProp.org.gradle.internal.repository.max.tentatives=8
